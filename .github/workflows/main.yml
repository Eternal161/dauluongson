name: Luong Son TV Auto Scraper

on:
  # Chặn lệnh từ cron-job.org (phải khớp với event_type bạn đặt là cron-trigger)
  repository_dispatch:
    types: [cron-trigger]
  
  # Cho phép bạn tự bấm chạy tay trên GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo về máy chủ GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Cài đặt Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Cài đặt các thư viện cần thiết
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright playwright-stealth PyGithub

      # 4. Cài đặt trình duyệt Chromium (để Bot mở được web Lương Sơn)
      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      # 5. Chạy Bot cào link
      - name: Run Scraper
        env:
          # Lấy mã Token bảo mật từ mục Settings > Secrets của bạn
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: "Eternal161/dauluongson"
        run: python main.py # Nhớ kiểm tra xem file của bạn tên là mainls.py hay main.py nhé!
